# Voice Mate status page, built with Upptime: https://upptime.js.org/docs/configuration
owner: Voice-Mate
repo: status-page
user-agent: voicemate-status
assignees:
  - two-trick-pony-NL

# Every check asks voicemate.us (the one domain). The `slug`s are the old file names, so the history is kept.
#
# The status endpoints answer {"status": "up"|"down", "degraded": true|false, "reasons": [...]}:
#  - "down" is when the body no longer matches "status": "up" (or the endpoint cannot be reached),
#  - "degraded" is a warning that something needs attention (a low Twilio balance, Stripe asking for information),
#  - "Offline for Maintenance" is what the app says in maintenance mode; that shows as degraded, not as an outage.
sites:
  - name: Voice Mate website
    slug: voice-mate-website
    url: https://voicemate.us
    maxResponseTime: 3000
    __dangerous__body_degraded: "Offline for Maintenance"

  - name: Voice Mate app and API
    slug: voice-mate-application-api
    url: https://voicemate.us/healthcheck
    maxResponseTime: 3000
    __dangerous__body_degraded: "Offline for Maintenance"

  - name: Database
    slug: voice-mate-database
    url: https://voicemate.us/databasestatus
    maxResponseTime: 3000
    __dangerous__body_degraded: "Offline for Maintenance"
    __dangerous__body_down_if_regex_missing: '"status":\s*"up"'

  - name: Call processing and notifications
    slug: voice-mate-background-processing
    url: https://voicemate.us/pipelinestatus
    maxResponseTime: 3000
    __dangerous__body_degraded: "Offline for Maintenance"
    __dangerous__body_down_if_regex_missing: '"status":\s*"up"'

  - name: Phone calls and texts (Twilio)
    slug: phone-call-handling-twilio
    url: https://voicemate.us/twiliostatus
    maxResponseTime: 5000
    __dangerous__body_down_if_regex_missing: '"status":\s*"up"'
    __dangerous__body_degraded: '"degraded": true'

  - name: Payments (Stripe)
    slug: payments-stripe
    url: https://voicemate.us/stripestatus
    maxResponseTime: 5000
    __dangerous__body_down_if_regex_missing: '"status":\s*"up"'
    __dangerous__body_degraded: '"degraded": true'

  - name: Voice AI (Vapi)
    slug: ai-powered-voice-processing-services-vapi
    url: https://status.vapi.ai

status-website:
  cname: status.voicemate.nl
  name: Voice Mate status
  logoUrl: https://avatars.githubusercontent.com/u/166385585?s=200&v=4
  favicon: https://avatars.githubusercontent.com/u/166385585?s=64&v=4
  introTitle: "**Voice Mate** status"
  introMessage: >-
    Live status of the Voice Mate app and the services behind it: the website and API, the database, call processing,
    phone calls and texts, payments and voice AI. Checked every five minutes. If something is down, an incident is
    opened here and closed when it is fixed.
  theme: light
  css: |
    body { background-color: #fafafa; }
    .container { max-width: 880px; }
  metaTags:
    - name: description
      content: Live status and incident history of Voice Mate, the AI voicemail assistant.
  navbar:
    - title: Status
      href: /
    - title: Voice Mate
      href: https://voicemate.us
    - title: GitHub
      href: https://github.com/$OWNER
